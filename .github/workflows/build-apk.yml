name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The repo has no Gradle wrapper jar, so install the version it pins.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # debug.keystore is git-ignored but app/build.gradle.kts requires it.
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LexiGrid.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LexiGrid-apk
          path: LexiGrid.apk

      # Publishes a downloadable release so you can grab the APK from your phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LexiGrid (latest build)
          files: LexiGrid.apk
          prerelease: false
